name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Endpoints come from repository variables when set. Ordinary rebuilds
      # keep existing non-null https values in js/config.js if a variable is
      # unset, so live FormSubmit / Calendar URLs are not wiped.

      - name: Build
        env:
          ZOE_SITE_URL: ${{ vars.ZOE_SITE_URL || 'https://www.zoelifehub.com' }}
          ZOE_FORM_ENDPOINT: ${{ vars.ZOE_FORM_ENDPOINT }}
          ZOE_NEWSLETTER_ENDPOINT: ${{ vars.ZOE_NEWSLETTER_ENDPOINT }}
          ZOE_GOOGLE_CALENDAR_BOOKING_URL: ${{ vars.ZOE_GOOGLE_CALENDAR_BOOKING_URL }}
          ZOE_BOOKING_URL: ${{ vars.ZOE_BOOKING_URL }}
          ZOE_STRIPE_DEVOTIONAL_URL: ${{ vars.ZOE_STRIPE_DEVOTIONAL_URL }}
          ZOE_PAYPAL_DEVOTIONAL_URL: ${{ vars.ZOE_PAYPAL_DEVOTIONAL_URL }}
          ZOE_AMAZON_DEVOTIONAL_URL: ${{ vars.ZOE_AMAZON_DEVOTIONAL_URL }}
          ZOE_ETSY_DEVOTIONAL_URL: ${{ vars.ZOE_ETSY_DEVOTIONAL_URL }}
          ZOE_GUMROAD_DEVOTIONAL_URL: ${{ vars.ZOE_GUMROAD_DEVOTIONAL_URL }}
          ZOE_STRIPE_JOURNAL_URL: ${{ vars.ZOE_STRIPE_JOURNAL_URL }}
          ZOE_PAYPAL_JOURNAL_URL: ${{ vars.ZOE_PAYPAL_JOURNAL_URL }}
          ZOE_AMAZON_JOURNAL_URL: ${{ vars.ZOE_AMAZON_JOURNAL_URL }}
          ZOE_ETSY_JOURNAL_URL: ${{ vars.ZOE_ETSY_JOURNAL_URL }}
          ZOE_GUMROAD_JOURNAL_URL: ${{ vars.ZOE_GUMROAD_JOURNAL_URL }}
          # Default to staging so a deploy made before the domain is switched
          # cannot compete in search with the live Squarespace site.
          ZOE_STAGING: ${{ (github.event.inputs.mode == 'production' || vars.ZOE_MODE == 'production') && '0' || '1' }}
        run: node tools/build.mjs

      - name: Static checks
        run: |
          node tests/check-site.mjs
          node tests/check-build.mjs

      - name: Assemble site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp -r index.html about.html books.html connect.html contact.html consult.html \
                family-life.html appointments.html \
                404.html robots.txt sitemap.xml favicon.svg \
                css js fonts assets _site/
          # Pretty URLs: /about serves about.html on GitHub Pages.
          for p in about books connect contact consult family-life appointments; do
            mkdir -p "_site/$p" && cp "$p.html" "_site/$p/index.html"
          done
          test -f CNAME && cp CNAME _site/ || echo "no CNAME, serving on the Pages domain"
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Deploy only runs when asked for explicitly.
  #
  # This repo's Pages is still on the legacy branch source
  # (claude/zoe-life-website-boiqf0), and the github-pages environment only
  # permits that branch, so an automatic deploy from main is rejected. Changing
  # either needs repository ADMIN.
  #
  # To enable Actions-based deploys:
  #   Settings > Pages > Source: GitHub Actions
  #   Settings > Environments > github-pages > add `main` to the branch policy
  # Until then, pushing to the Pages source branch publishes the site directly.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
